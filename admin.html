<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de pedidos - DeskFox</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #fdf7f0; font-family: "Poppins","Segoe UI",sans-serif; color: #3d2817; margin: 0; }

        #dx-login { max-width: 340px; margin: 90px auto; background: #fff; border: 2px solid #ff8c42;
            border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        #dx-login h1 { font-size: 20px; color: #e67e22; margin: 0 0 16px; }
        #dx-login input { width: 100%; box-sizing: border-box; padding: 11px; margin: 6px 0;
            border: 1px solid #eadfce; border-radius: 9px; font: 14px "Poppins","Segoe UI",sans-serif; }
        #dx-login button { width: 100%; margin-top: 8px; padding: 11px; border: none; border-radius: 10px;
            background: #ff8c42; color: #fff; font-weight: 700; cursor: pointer; }
        #dx-login-msg { color: #c0392b; font-size: 13px; min-height: 18px; }

        #dx-app { display: none; }

        .dx-topbar { position: sticky; top: 0; z-index: 5; background: #fdf7f0; border-bottom: 1px solid #f0dfc9;
            padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
        .dx-topbar h1 { font-size: 22px; margin: 0; color: #e67e22; display: flex; align-items: center; gap: 8px; }
        .dx-live { width: 9px; height: 9px; border-radius: 50%; background: #2e7d32;
            box-shadow: 0 0 0 rgba(46,125,50,.5); animation: dx-pulse 1.8s infinite; }
        @keyframes dx-pulse {
            0% { box-shadow: 0 0 0 0 rgba(46,125,50,.5); }
            70% { box-shadow: 0 0 0 7px rgba(46,125,50,0); }
            100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
        }
        .dx-logout { padding: 9px 16px; border: 1px solid #e0c9a6; border-radius: 9px; background: #fff;
            color: #7a5a35; font-weight: 600; cursor: pointer; font-size: 13px; }

        .dx-wrap { max-width: 980px; margin: 0 auto; padding: 20px 24px 60px; }

        .dx-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .dx-filter { padding: 8px 14px; border-radius: 20px; border: 1px solid #eadfce; background: #fff;
            color: #7a5a35; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .dx-filter .dx-count { background: #f0e4d4; color: #7a5a35; border-radius: 10px; padding: 1px 7px; font-size: 12px; }
        .dx-filter.active { background: #ff8c42; border-color: #ff8c42; color: #fff; }
        .dx-filter.active .dx-count { background: rgba(255,255,255,.3); color: #fff; }

        .dx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

        .dx-order { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(61,40,23,.06);
            border-left: 5px solid #ccc; display: flex; flex-direction: column; gap: 10px; }
        .dx-order.pendiente { border-left-color: #c0392b; }
        .dx-order.preparando { border-left-color: #e67e22; }
        .dx-order.listo { border-left-color: #2e7d32; }
        .dx-order.entregado { border-left-color: #9a9a9a; }

        .dx-order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .dx-order-who { font-weight: 700; font-size: 16px; }
        .dx-order-time { font-size: 12px; color: #a08b6f; margin-top: 2px; }

        .dx-badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: 700;
            white-space: nowrap; text-transform: uppercase; letter-spacing: .3px; }
        .dx-badge.pendiente { background: #fdecea; color: #c0392b; }
        .dx-badge.preparando { background: #fff4e0; color: #e67e22; }
        .dx-badge.listo { background: #e8f6ea; color: #2e7d32; }
        .dx-badge.entregado { background: #eee; color: #777; }

        .dx-order ul { margin: 0; padding-left: 18px; font-size: 14px; color: #4a3826; }
        .dx-order ul li { margin-bottom: 2px; }

        .dx-order-total { display: flex; justify-content: space-between; align-items: center;
            border-top: 1px dashed #eee0cc; padding-top: 10px; font-weight: 700; font-size: 15px; }

        .dx-order-actions { display: flex; gap: 8px; }
        .dx-order-actions select { flex: 1; padding: 7px 8px; border-radius: 8px; border: 1px solid #eadfce;
            font: 13px "Poppins","Segoe UI",sans-serif; background: #fff; color: #3d2817; }
        .dx-del-btn { padding: 7px 12px; border-radius: 8px; border: 1px solid #f3c8c2; background: #fdecea;
            color: #c0392b; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .dx-del-btn:hover { background: #c0392b; color: #fff; }

        .dx-empty { text-align: center; color: #a08b6f; padding: 60px 0; font-size: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div id="dx-login">
        <h1>Acceso del personal</h1>
        <input id="dx-email" type="email" placeholder="Correo">
        <input id="dx-pass" type="password" placeholder="Contraseña">
        <div id="dx-login-msg"></div>
        <button id="dx-login-btn">Entrar</button>
    </div>

    <div id="dx-app">
        <div class="dx-topbar">
            <h1><span class="dx-live"></span> Pedidos DeskFox</h1>
            <button class="dx-logout" id="dx-logout-btn">Salir</button>
        </div>
        <div class="dx-wrap">
            <div class="dx-filters" id="dx-filters"></div>
            <div class="dx-grid" id="dx-orders"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

        var ESTADOS = ['pendiente', 'preparando', 'listo', 'entregado'];
        var filtro = 'todos';
        var pedidosCache = [];

        var loginBox = document.getElementById('dx-login');
        var app = document.getElementById('dx-app');
        var ordersEl = document.getElementById('dx-orders');
        var filtersEl = document.getElementById('dx-filters');
        var loginMsg = document.getElementById('dx-login-msg');

        document.getElementById('dx-login-btn').addEventListener('click', function () {
            var email = document.getElementById('dx-email').value.trim();
            var pass = document.getElementById('dx-pass').value;
            loginMsg.textContent = '';
            sb.auth.signInWithPassword({ email: email, password: pass }).then(function (res) {
                if (res.error) { loginMsg.textContent = 'Correo o contraseña incorrectos'; return; }
                showApp();
            });
        });

        document.getElementById('dx-logout-btn').addEventListener('click', function () {
            sb.auth.signOut().then(function () { location.reload(); });
        });

        function showApp() {
            loginBox.style.display = 'none';
            app.style.display = 'block';
            loadOrders();
            sb.channel('pedidos-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, loadOrders)
                .subscribe();
        }

        function loadOrders() {
            sb.from('pedidos').select('*').order('creado_en', { ascending: false }).then(function (res) {
                if (res.error) { ordersEl.innerHTML = '<div class="dx-empty">Error cargando pedidos: ' + res.error.message + '</div>'; return; }
                pedidosCache = res.data || [];
                renderFilters();
                renderOrders();
            });
        }

        function renderFilters() {
            var counts = { todos: pedidosCache.length };
            ESTADOS.forEach(function (e) { counts[e] = pedidosCache.filter(function (p) { return p.estado === e; }).length; });

            var tabs = [{ id: 'todos', label: 'Todos' }].concat(
                ESTADOS.map(function (e) { return { id: e, label: e.charAt(0).toUpperCase() + e.slice(1) }; })
            );

            filtersEl.innerHTML = tabs.map(function (t) {
                return '<button class="dx-filter' + (filtro === t.id ? ' active' : '') + '" data-filter="' + t.id + '">' +
                    t.label + ' <span class="dx-count">' + counts[t.id] + '</span></button>';
            }).join('');

            filtersEl.querySelectorAll('[data-filter]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    filtro = btn.dataset.filter;
                    renderFilters();
                    renderOrders();
                });
            });
        }

        function timeAgo(iso) {
            var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (diff < 60) return 'hace un momento';
            if (diff < 3600) return 'hace ' + Math.floor(diff / 60) + ' min';
            if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + ' h';
            return new Date(iso).toLocaleDateString();
        }

        function renderOrders() {
            var lista = filtro === 'todos' ? pedidosCache : pedidosCache.filter(function (p) { return p.estado === filtro; });

            if (!lista.length) {
                ordersEl.innerHTML = '<div class="dx-empty">No hay pedidos ' + (filtro === 'todos' ? '' : 'en "' + filtro + '"') + '</div>';
                return;
            }

            ordersEl.innerHTML = lista.map(function (o) {
                var items = (o.items || []).map(function (it) {
                    return '<li>' + it.cantidad + '× ' + it.producto + '</li>';
                }).join('');

                return (
                    '<div class="dx-order ' + o.estado + '">' +
                    '<div class="dx-order-top">' +
                    '<div><div class="dx-order-who">' + o.mesa_nombre + '</div>' +
                    '<div class="dx-order-time">' + timeAgo(o.creado_en) + '</div></div>' +
                    '<span class="dx-badge ' + o.estado + '">' + o.estado + '</span>' +
                    '</div>' +
                    '<ul>' + items + '</ul>' +
                    '<div class="dx-order-total"><span>Total</span><span>$' + Number(o.total).toFixed(2) + '</span></div>' +
                    '<div class="dx-order-actions">' +
                    '<select data-id="' + o.id + '">' +
                    ESTADOS.map(function (s) {
                        return '<option value="' + s + '"' + (s === o.estado ? ' selected' : '') + '>' + s + '</option>';
                    }).join('') +
                    '</select>' +
                    '<button class="dx-del-btn" data-del="' + o.id + '">Eliminar</button>' +
                    '</div>' +
                    '</div>'
                );
            }).join('');

            ordersEl.querySelectorAll('select').forEach(function (sel) {
                sel.addEventListener('change', function () {
                    sb.from('pedidos').update({ estado: sel.value }).eq('id', sel.dataset.id).then(loadOrders);
                });
            });
            ordersEl.querySelectorAll('[data-del]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    if (!confirm('¿Eliminar este pedido? Esta acción no se puede deshacer.')) return;
                    sb.from('pedidos').delete().eq('id', btn.dataset.del).then(function (res) {
                        if (res.error) { alert('Error al eliminar: ' + res.error.message); return; }
                        loadOrders();
                    });
                });
            });
        }

        sb.auth.getSession().then(function (res) {
            if (res.data.session) showApp();
        });
    </script>
</body>
</html>
